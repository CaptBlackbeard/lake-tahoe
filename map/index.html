<style>

    --berry:#F06A72; --pine:#7FC4A2; --gold:#E2B860; color-scheme:dark;

  header{flex:0 0 auto;padding:.7rem 16px;border-bottom:1px solid var(--rule);background:var(--surface);
         display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}
  header h1{font-family:var(--display);font-weight:900;font-size:1.45rem;margin:0;line-height:1.1}
  .back{font-size:.95rem;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--gold)}
  .back:hover{color:var(--berry)}
  .spacer{flex:1 1 auto}
  .views{display:flex;gap:.4rem;flex-wrap:wrap}
  .views button{font-family:var(--body);font-weight:700;font-size:.95rem;cursor:pointer;background:transparent;color:var(--ink);
    border:1px solid var(--rule);border-radius:999px;padding:.3rem .85rem}
  .views button[aria-pressed="true"]{background:var(--pine);color:#FFFDF8;border-color:var(--pine)}
  #map{flex:1 1 auto;min-height:0;width:100%;background:var(--rule)}
  .legend{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:.5rem 1.1rem;align-items:center;
          padding:.65rem 16px calc(.65rem + env(safe-area-inset-bottom,0px));
          border-top:1px solid var(--rule);background:var(--surface);font-size:.92rem}
  .key{display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;user-select:none}
  .key input{margin:0}
  .dot{width:13px;height:13px;border-radius:50%;border:2px solid #FFFDF8;box-shadow:0 0 0 1px rgba(0,0,0,.25);display:inline-block}
  .dot.sq{border-radius:3px}
  .line{width:22px;height:4px;display:inline-block;border-radius:2px}
  .hint{color:var(--ink-soft);font-style:italic;font-size:.88rem}
  .mk{border-radius:50%;border:2px solid #FFFDF8;box-shadow:0 1px 4px rgba(0,0,0,.45)}
  .mk.hotel{border-radius:4px;border-width:3px}
  .mk.num{display:flex;align-items:center;justify-content:center;color:#fff;font:700 11px/1 var(--body);border-radius:6px}
  .mk.sel{transform:scale(1.5);box-shadow:0 0 0 4px #A3242F,0 2px 10px rgba(0,0,0,.6)}
  .leaflet-popup-content-wrapper{border-radius:4px;background:var(--surface);color:var(--ink)}
  .leaflet-popup-tip{background:var(--surface)}
  .leaflet-popup-content{margin:.7rem .85rem;font-family:var(--body);font-size:.95rem;line-height:1.45}
  .pop-n{font-family:var(--display);font-size:1.15rem;font-weight:700;display:block}
  .pop-a{color:var(--ink-soft);font-style:italic}
  .pop-d{display:block;margin-top:.25rem}
  .pop-l{display:block;margin-top:.4rem;padding-top:.35rem;border-top:1px solid var(--rule)}
  @media (max-width:560px){ header h1{font-size:1.2rem;width:100%} .legend{font-size:.85rem;gap:.4rem .8rem} }
</style>
